<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pico PRD Review · 文档批注</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  display: flex;
  height: 100vh;
  overflow: hidden;
  background: #0f0f13;
  font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
  color: #e0e0e0;
}

/* ===== 左侧文件列表 ===== */
#sidebar {
  width: 220px;
  min-width: 220px;
  background: #16161e;
  border-right: 1px solid #2a2a3e;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#sidebar-header {
  padding: 16px 14px 12px;
  border-bottom: 1px solid #2a2a3e;
}

#sidebar-header h1 {
  font-size: 13px;
  font-weight: 700;
  color: #ff6b9d;
  letter-spacing: 0.5px;
}

#sidebar-header p {
  font-size: 10px;
  color: #666;
  margin-top: 3px;
}

#token-section {
  padding: 10px 14px;
  border-bottom: 1px solid #2a2a3e;
}

#token-section label {
  font-size: 10px;
  color: #888;
  display: block;
  margin-bottom: 4px;
}

#gh-token {
  width: 100%;
  background: #1e1e2e;
  border: 1px solid #333;
  border-radius: 4px;
  padding: 5px 8px;
  font-size: 10px;
  color: #ccc;
  outline: none;
}

#gh-token:focus { border-color: #ff6b9d; }

#load-btn {
  width: 100%;
  margin-top: 6px;
  background: linear-gradient(135deg, #ff6b9d, #c96bff);
  border: none;
  border-radius: 4px;
  padding: 6px;
  font-size: 11px;
  color: #fff;
  cursor: pointer;
  font-weight: 600;
}

#load-btn:hover { opacity: 0.85; }

#file-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}

.file-item {
  padding: 8px 14px;
  cursor: pointer;
  border-radius: 0;
  transition: background 0.15s;
  border-left: 3px solid transparent;
}

.file-item:hover { background: #1e1e2e; }

.file-item.active {
  background: #1e1e2e;
  border-left-color: #ff6b9d;
}

.file-item .fname {
  font-size: 11px;
  color: #ccc;
  word-break: break-all;
  line-height: 1.4;
}

.file-item .fmeta {
  font-size: 9px;
  color: #555;
  margin-top: 2px;
}

.file-item .badge {
  display: inline-block;
  background: #ff6b9d33;
  color: #ff6b9d;
  font-size: 9px;
  padding: 1px 5px;
  border-radius: 8px;
  margin-top: 3px;
}

/* ===== 主内容区 ===== */
#main {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* ===== 文档阅读区 ===== */
#doc-area {
  flex: 1;
  overflow-y: auto;
  padding: 32px 48px;
  background: #f9f9fb;
  color: #1a1a2e;
  position: relative;
}

#doc-area.dark-mode {
  background: #0f0f13;
  color: #e0e0e0;
}

#doc-placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: #888;
  text-align: center;
}

#doc-placeholder .icon { font-size: 48px; margin-bottom: 16px; }
#doc-placeholder h2 { font-size: 18px; color: #aaa; margin-bottom: 8px; }
#doc-placeholder p { font-size: 13px; color: #666; line-height: 1.6; }

/* Markdown 渲染样式 */
#doc-content {
  max-width: 780px;
  margin: 0 auto;
  line-height: 1.8;
  font-size: 15px;
}

#doc-content h1 { font-size: 24px; font-weight: 700; margin: 0 0 16px; color: #1a1a2e; border-bottom: 2px solid #ff6b9d; padding-bottom: 8px; }
#doc-content h2 { font-size: 18px; font-weight: 600; margin: 28px 0 12px; color: #2a2a3e; }
#doc-content h3 { font-size: 15px; font-weight: 600; margin: 20px 0 8px; color: #3a3a4e; }
#doc-content p { margin: 0 0 12px; }
#doc-content blockquote { border-left: 3px solid #ff6b9d; padding: 8px 16px; background: #fff0f5; margin: 12px 0; border-radius: 0 6px 6px 0; color: #555; }
#doc-content code { background: #f0f0f8; padding: 2px 6px; border-radius: 3px; font-size: 13px; font-family: 'SF Mono', Consolas, monospace; color: #c96bff; }
#doc-content pre { background: #1e1e2e; padding: 16px; border-radius: 8px; overflow-x: auto; margin: 12px 0; }
#doc-content pre code { background: none; color: #e0e0e0; padding: 0; }
#doc-content table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 13px; }
#doc-content th { background: #f0f0f8; padding: 8px 12px; text-align: left; border: 1px solid #ddd; font-weight: 600; color: #2a2a3e; }
#doc-content td { padding: 8px 12px; border: 1px solid #eee; }
#doc-content tr:nth-child(even) td { background: #fafafa; }
#doc-content ul, #doc-content ol { padding-left: 24px; margin: 0 0 12px; }
#doc-content li { margin: 4px 0; }
#doc-content hr { border: none; border-top: 1px solid #eee; margin: 24px 0; }
#doc-content strong { color: #1a1a2e; }
#doc-content a { color: #ff6b9d; text-decoration: none; }

/* dark mode doc */
#doc-area.dark-mode #doc-content h1 { color: #e0e0e0; }
#doc-area.dark-mode #doc-content h2 { color: #ccc; }
#doc-area.dark-mode #doc-content h3 { color: #bbb; }
#doc-area.dark-mode #doc-content blockquote { background: #1e1e2e; color: #aaa; }
#doc-area.dark-mode #doc-content code { background: #2a2a3e; color: #c96bff; }
#doc-area.dark-mode #doc-content th { background: #2a2a3e; color: #ccc; border-color: #333; }
#doc-area.dark-mode #doc-content td { border-color: #2a2a3e; }
#doc-area.dark-mode #doc-content tr:nth-child(even) td { background: #1a1a2e; }
#doc-area.dark-mode #doc-content strong { color: #e0e0e0; }
#doc-area.dark-mode #doc-content hr { border-color: #2a2a3e; }

/* 划线高亮 */
.annotation-highlight {
  background: #ff6b9d44;
  border-bottom: 2px solid #ff6b9d;
  cursor: pointer;
  border-radius: 2px;
  transition: background 0.15s;
}

.annotation-highlight:hover { background: #ff6b9d66; }

/* 选中文字时的浮动工具栏 */
#selection-toolbar {
  position: fixed;
  background: #1e1e2e;
  border: 1px solid #ff6b9d;
  border-radius: 8px;
  padding: 6px 10px;
  display: none;
  gap: 6px;
  align-items: center;
  z-index: 1000;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}

#selection-toolbar button {
  background: linear-gradient(135deg, #ff6b9d, #c96bff);
  border: none;
  border-radius: 5px;
  padding: 5px 12px;
  font-size: 12px;
  color: #fff;
  cursor: pointer;
  font-weight: 600;
  white-space: nowrap;
}

#selection-toolbar button:hover { opacity: 0.85; }

#selection-toolbar .cancel-btn {
  background: #333;
  color: #aaa;
}

/* ===== 右侧批注面板 ===== */
#annotation-panel {
  width: 300px;
  min-width: 300px;
  background: #16161e;
  border-left: 1px solid #2a2a3e;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#panel-header {
  padding: 14px 16px;
  border-bottom: 1px solid #2a2a3e;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

#panel-header h2 {
  font-size: 13px;
  font-weight: 700;
  color: #ff6b9d;
}

#panel-header .count {
  background: #ff6b9d33;
  color: #ff6b9d;
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 600;
}

#annotation-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}

.annotation-card {
  background: #1e1e2e;
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 8px;
  border-left: 3px solid #ff6b9d;
  cursor: pointer;
  transition: border-color 0.15s;
  position: relative;
}

.annotation-card:hover { border-left-color: #c96bff; }

.annotation-card.resolved {
  border-left-color: #44bb88;
  opacity: 0.6;
}

.annotation-quote {
  font-size: 11px;
  color: #888;
  font-style: italic;
  margin-bottom: 6px;
  line-height: 1.4;
  border-left: 2px solid #333;
  padding-left: 6px;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

.annotation-comment {
  font-size: 12px;
  color: #ccc;
  line-height: 1.5;
  min-height: 20px;
}

.annotation-comment[contenteditable="true"] {
  outline: none;
  border-bottom: 1px dashed #ff6b9d;
  padding-bottom: 2px;
}

.annotation-meta {
  font-size: 10px;
  color: #555;
  margin-top: 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.annotation-actions {
  display: flex;
  gap: 6px;
}

.annotation-actions button {
  background: none;
  border: 1px solid #333;
  border-radius: 4px;
  padding: 2px 8px;
  font-size: 10px;
  color: #888;
  cursor: pointer;
}

.annotation-actions button:hover { border-color: #ff6b9d; color: #ff6b9d; }
.annotation-actions .resolve-btn:hover { border-color: #44bb88; color: #44bb88; }
.annotation-actions .delete-btn:hover { border-color: #ff4466; color: #ff4466; }

#panel-footer {
  padding: 12px;
  border-top: 1px solid #2a2a3e;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

#submit-btn {
  width: 100%;
  background: linear-gradient(135deg, #ff6b9d, #c96bff);
  border: none;
  border-radius: 8px;
  padding: 10px;
  font-size: 13px;
  color: #fff;
  cursor: pointer;
  font-weight: 700;
  letter-spacing: 0.3px;
}

#submit-btn:hover { opacity: 0.85; }
#submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }

#clear-resolved-btn {
  width: 100%;
  background: none;
  border: 1px solid #333;
  border-radius: 6px;
  padding: 6px;
  font-size: 11px;
  color: #666;
  cursor: pointer;
}

#clear-resolved-btn:hover { border-color: #555; color: #aaa; }

/* ===== 顶部工具栏 ===== */
#topbar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 44px;
  background: #f9f9fb;
  border-bottom: 1px solid #eee;
  display: flex;
  align-items: center;
  padding: 0 48px;
  gap: 12px;
  z-index: 100;
}

#doc-area.dark-mode #topbar {
  background: #0f0f13;
  border-bottom-color: #2a2a3e;
}

#doc-title {
  font-size: 13px;
  font-weight: 600;
  color: #2a2a3e;
  flex: 1;
}

#doc-area.dark-mode #doc-title { color: #ccc; }

.topbar-btn {
  background: none;
  border: 1px solid #ddd;
  border-radius: 5px;
  padding: 4px 10px;
  font-size: 11px;
  color: #666;
  cursor: pointer;
  white-space: nowrap;
}

.topbar-btn:hover { border-color: #ff6b9d; color: #ff6b9d; }

#doc-area.dark-mode .topbar-btn { border-color: #333; color: #888; }
#doc-area.dark-mode .topbar-btn:hover { border-color: #ff6b9d; color: #ff6b9d; }

#doc-content-wrapper {
  padding-top: 52px;
}

/* ===== 批注输入弹窗 ===== */
#comment-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 2000;
}

#comment-modal.show { display: flex; }

#comment-box {
  background: #1e1e2e;
  border-radius: 12px;
  padding: 20px;
  width: 400px;
  border: 1px solid #ff6b9d44;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}

#comment-box h3 {
  font-size: 14px;
  color: #ff6b9d;
  margin-bottom: 10px;
}

#comment-quote-preview {
  font-size: 11px;
  color: #888;
  font-style: italic;
  background: #16161e;
  padding: 8px 10px;
  border-radius: 6px;
  margin-bottom: 12px;
  border-left: 2px solid #ff6b9d;
  line-height: 1.5;
  max-height: 80px;
  overflow-y: auto;
}

#comment-textarea {
  width: 100%;
  background: #16161e;
  border: 1px solid #333;
  border-radius: 6px;
  padding: 10px;
  font-size: 13px;
  color: #ccc;
  resize: vertical;
  min-height: 80px;
  outline: none;
  font-family: inherit;
}

#comment-textarea:focus { border-color: #ff6b9d; }

#comment-textarea::placeholder { color: #555; }

#comment-modal-actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  justify-content: flex-end;
}

#comment-modal-actions button {
  border-radius: 6px;
  padding: 7px 16px;
  font-size: 12px;
  cursor: pointer;
  font-weight: 600;
}

#comment-confirm-btn {
  background: linear-gradient(135deg, #ff6b9d, #c96bff);
  border: none;
  color: #fff;
}

#comment-cancel-btn {
  background: none;
  border: 1px solid #333;
  color: #888;
}

/* ===== 提交结果弹窗 ===== */
#submit-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 2000;
}

#submit-modal.show { display: flex; }

#submit-box {
  background: #1e1e2e;
  border-radius: 12px;
  padding: 24px;
  width: 560px;
  max-height: 80vh;
  border: 1px solid #ff6b9d44;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  display: flex;
  flex-direction: column;
}

#submit-box h3 {
  font-size: 15px;
  color: #ff6b9d;
  margin-bottom: 4px;
}

#submit-box p {
  font-size: 11px;
  color: #666;
  margin-bottom: 12px;
}

#submit-output {
  flex: 1;
  background: #16161e;
  border: 1px solid #333;
  border-radius: 8px;
  padding: 14px;
  font-size: 12px;
  color: #ccc;
  font-family: 'SF Mono', Consolas, monospace;
  overflow-y: auto;
  white-space: pre-wrap;
  line-height: 1.6;
  max-height: 400px;
}

#submit-modal-actions {
  display: flex;
  gap: 8px;
  margin-top: 14px;
  justify-content: flex-end;
}

#copy-btn {
  background: linear-gradient(135deg, #ff6b9d, #c96bff);
  border: none;
  border-radius: 6px;
  padding: 8px 20px;
  font-size: 12px;
  color: #fff;
  cursor: pointer;
  font-weight: 600;
}

#close-submit-btn {
  background: none;
  border: 1px solid #333;
  border-radius: 6px;
  padding: 8px 16px;
  font-size: 12px;
  color: #888;
  cursor: pointer;
}

/* ===== Toast ===== */
#toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #1e1e2e;
  border: 1px solid #ff6b9d44;
  border-radius: 8px;
  padding: 10px 20px;
  font-size: 13px;
  color: #ccc;
  opacity: 0;
  transition: all 0.3s;
  z-index: 3000;
  pointer-events: none;
}

#toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ===== 空批注状态 ===== */
#empty-annotations {
  text-align: center;
  padding: 40px 20px;
  color: #555;
}

#empty-annotations .icon { font-size: 32px; margin-bottom: 10px; }
#empty-annotations p { font-size: 12px; line-height: 1.6; }

/* 滚动条 */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: #555; }
</style>
</head>
<body>

<!-- 左侧文件列表 -->
<div id="sidebar">
  <div id="sidebar-header">
    <h1>💕 Pico PRD Review</h1>
    <p>文档批注 · 修改追踪</p>
  </div>
  <div id="token-section">
    <label>GitHub Token（访问私有仓库）</label>
    <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx" />
    <button id="load-btn" onclick="loadFileList()">加载文档列表</button>
  </div>
  <div id="file-list">
    <div style="padding: 20px 14px; color: #555; font-size: 11px; text-align: center;">
      输入 Token 后加载文档
    </div>
  </div>
</div>

<!-- 主内容区 -->
<div id="main">
  <!-- 文档阅读区 -->
  <div id="doc-area">
    <div id="topbar">
      <span id="doc-title">请选择文档</span>
      <button class="topbar-btn" onclick="toggleDark()">🌙 深色</button>
      <button class="topbar-btn" onclick="scrollToFirstAnnotation()">📍 跳到批注</button>
    </div>
    <div id="doc-content-wrapper">
      <div id="doc-placeholder">
        <div class="icon">📄</div>
        <h2>选择一个文档开始批注</h2>
        <p>从左侧列表选择 PRD 文档<br>选中文字后点击「添加批注」<br>完成后点击「提交给 Manus」</p>
      </div>
      <div id="doc-content" style="display:none;"></div>
    </div>
  </div>

  <!-- 右侧批注面板 -->
  <div id="annotation-panel">
    <div id="panel-header">
      <h2>批注列表</h2>
      <span class="count" id="annotation-count">0</span>
    </div>
    <div id="annotation-list">
      <div id="empty-annotations">
        <div class="icon">✏️</div>
        <p>选中文档中的文字<br>即可添加批注</p>
      </div>
    </div>
    <div id="panel-footer">
      <button id="submit-btn" onclick="submitAnnotations()" disabled>✅ 提交给 Manus</button>
      <button id="clear-resolved-btn" onclick="clearResolved()">清除已解决批注</button>
    </div>
  </div>
</div>

<!-- 选中文字浮动工具栏 -->
<div id="selection-toolbar">
  <button onclick="addAnnotation()">✏️ 添加批注</button>
  <button onclick="addHighlightOnly()">🖊 仅高亮</button>
  <button class="cancel-btn" onclick="hideToolbar()">取消</button>
</div>

<!-- 批注输入弹窗 -->
<div id="comment-modal">
  <div id="comment-box">
    <h3>✏️ 添加批注</h3>
    <div id="comment-quote-preview"></div>
    <textarea id="comment-textarea" placeholder="写下你的修改意见或问题…（可留空，仅高亮）"></textarea>
    <div id="comment-modal-actions">
      <button id="comment-cancel-btn" onclick="closeCommentModal()">取消</button>
      <button id="comment-confirm-btn" onclick="confirmAnnotation()">确认添加</button>
    </div>
  </div>
</div>

<!-- 提交结果弹窗 -->
<div id="submit-modal">
  <div id="submit-box">
    <h3>📋 修改指令（复制给 Manus）</h3>
    <p>以下是根据你的批注整理的结构化修改指令，复制后粘贴给 Manus 即可</p>
    <div id="submit-output"></div>
    <div id="submit-modal-actions">
      <button id="close-submit-btn" onclick="closeSubmitModal()">关闭</button>
      <button id="copy-btn" onclick="copyOutput()">📋 复制全部</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
// ===== 状态 =====
let currentFile = null;
let currentFileContent = null;
let annotations = {}; // { fileKey: [{ id, quote, comment, range, resolved, timestamp }] }
let pendingSelection = null;
let ghToken = '';
const REPO = 'xleft/picoPM';
const BRANCH = 'main';

// ===== 初始化 =====
window.addEventListener('load', () => {
  let savedToken = localStorage.getItem('pico_gh_token') || '';
  // 去重：如果 token 是某个字符串的重复，只取前半部分
  if (savedToken.length > 0 && savedToken.length % 2 === 0) {
    const half = savedToken.slice(0, savedToken.length / 2);
    if (half + half === savedToken) savedToken = half;
  }
  if (savedToken) {
    document.getElementById('gh-token').value = savedToken;
    ghToken = savedToken;
    localStorage.setItem('pico_gh_token', savedToken); // 写回修复后的正确值
    loadFileList();
  }

  const savedAnnotations = localStorage.getItem('pico_annotations');
  if (savedAnnotations) {
    try { annotations = JSON.parse(savedAnnotations); } catch(e) {}
  }

  // 监听文字选中
  document.getElementById('doc-content').addEventListener('mouseup', onTextSelect);
  document.addEventListener('mousedown', onDocMouseDown);
});

// ===== GitHub API =====
async function ghFetch(path) {
  // 优先用内存中的 token，其次从 localStorage 读取，最后才从输入框读取
  const token = ghToken || localStorage.getItem('pico_gh_token') || document.getElementById('gh-token').value.trim();
  if (!token) { showToast('请先输入 GitHub Token'); return null; }
  ghToken = token;
  localStorage.setItem('pico_gh_token', token);

  const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}?ref=${BRANCH}`, {
    headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
  });
  if (!res.ok) {
    showToast(`GitHub API 错误: ${res.status}`);
    return null;
  }
  return res.json();
}

async function loadFileList() {
  const inputToken = document.getElementById('gh-token').value.trim();
  // 如果输入框有新值就用新值，否则用缓存
  const token = inputToken || ghToken || localStorage.getItem('pico_gh_token');
  if (!token) { showToast('请先输入 GitHub Token'); return; }
  ghToken = token;
  // 更新输入框显示正确的 token（防止重复追加）
  document.getElementById('gh-token').value = token;
  localStorage.setItem('pico_gh_token', token);

  const btn = document.getElementById('load-btn');
  btn.textContent = '加载中…';
  btn.disabled = true;

  try {
    const res = await fetch(`https://api.github.com/repos/${REPO}/git/trees/${BRANCH}?recursive=1`, {
      headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
    });
    if (!res.ok) throw new Error(`${res.status}`);
    const data = await res.json();

    const mdFiles = data.tree.filter(f => f.type === 'blob' && f.path.endsWith('.md') && !f.path.includes('/'));
    renderFileList(mdFiles);
    showToast(`已加载 ${mdFiles.length} 个文档`);
  } catch(e) {
    showToast(`加载失败: ${e.message}`);
  } finally {
    btn.textContent = '加载文档列表';
    btn.disabled = false;
  }
}

function renderFileList(files) {
  const list = document.getElementById('file-list');
  list.innerHTML = '';

  // PRD 文件优先
  const sorted = [...files].sort((a, b) => {
    const aIsPRD = a.path.startsWith('PRD_');
    const bIsPRD = b.path.startsWith('PRD_');
    if (aIsPRD && !bIsPRD) return -1;
    if (!aIsPRD && bIsPRD) return 1;
    return a.path.localeCompare(b.path);
  });

  sorted.forEach(f => {
    const item = document.createElement('div');
    item.className = 'file-item';
    item.dataset.path = f.path;

    const count = (annotations[f.path] || []).filter(a => !a.resolved).length;
    const badge = count > 0 ? `<span class="badge">${count} 条批注</span>` : '';

    item.innerHTML = `
      <div class="fname">${f.path.replace('.md', '')}</div>
      ${badge}
    `;
    item.onclick = () => openFile(f.path);
    list.appendChild(item);
  });
}

async function openFile(path) {
  const data = await ghFetch(path);
  if (!data) return;

  currentFile = path;
  // 正确解码 UTF-8 base64（atob 不支持多字节中文）
  const b64 = data.content.replace(/\n/g, '');
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  currentFileContent = new TextDecoder('utf-8').decode(bytes);

  // 更新侧边栏选中状态
  document.querySelectorAll('.file-item').forEach(el => {
    el.classList.toggle('active', el.dataset.path === path);
  });

  // 渲染 Markdown
  const html = marked.parse(currentFileContent);
  const docContent = document.getElementById('doc-content');
  docContent.innerHTML = html;
  docContent.style.display = 'block';
  document.getElementById('doc-placeholder').style.display = 'none';
  document.getElementById('doc-title').textContent = path.replace('.md', '');

  // 恢复已有高亮
  restoreHighlights(path);
  updateAnnotationPanel();

  // 滚动到顶部
  document.getElementById('doc-area').scrollTop = 0;
}

// ===== 文字选中 =====
function onTextSelect(e) {
  const selection = window.getSelection();
  if (!selection || selection.isCollapsed) {
    hideToolbar();
    return;
  }

  const text = selection.toString().trim();
  if (!text || text.length < 2) {
    hideToolbar();
    return;
  }

  // 确保选中范围在文档内容区
  const docContent = document.getElementById('doc-content');
  const range = selection.getRangeAt(0);
  if (!docContent.contains(range.commonAncestorContainer)) {
    hideToolbar();
    return;
  }

  pendingSelection = {
    text: text,
    range: range.cloneRange()
  };

  // 显示浮动工具栏
  const rect = range.getBoundingClientRect();
  const toolbar = document.getElementById('selection-toolbar');
  toolbar.style.display = 'flex';
  toolbar.style.left = `${rect.left + rect.width / 2 - 80}px`;
  toolbar.style.top = `${rect.top - 48}px`;
}

function onDocMouseDown(e) {
  const toolbar = document.getElementById('selection-toolbar');
  if (!toolbar.contains(e.target) && e.target.id !== 'doc-content') {
    // 延迟隐藏，避免点击按钮时立即消失
    setTimeout(() => {
      if (window.getSelection().isCollapsed) hideToolbar();
    }, 100);
  }
}

function hideToolbar() {
  document.getElementById('selection-toolbar').style.display = 'none';
}

// ===== 添加批注 =====
function addAnnotation() {
  if (!pendingSelection) return;
  hideToolbar();

  document.getElementById('comment-quote-preview').textContent =
    `"${pendingSelection.text.length > 100 ? pendingSelection.text.slice(0, 100) + '…' : pendingSelection.text}"`;
  document.getElementById('comment-textarea').value = '';
  document.getElementById('comment-modal').classList.add('show');
  setTimeout(() => document.getElementById('comment-textarea').focus(), 100);
}

function addHighlightOnly() {
  if (!pendingSelection) return;
  hideToolbar();
  saveAnnotation('');
}

function closeCommentModal() {
  document.getElementById('comment-modal').classList.remove('show');
  pendingSelection = null;
}

function confirmAnnotation() {
  const comment = document.getElementById('comment-textarea').value.trim();
  saveAnnotation(comment);
  closeCommentModal();
}

function saveAnnotation(comment) {
  if (!pendingSelection || !currentFile) return;

  const id = 'ann_' + Date.now();
  const annotation = {
    id,
    quote: pendingSelection.text,
    comment,
    resolved: false,
    timestamp: new Date().toISOString()
  };

  if (!annotations[currentFile]) annotations[currentFile] = [];
  annotations[currentFile].push(annotation);
  persistAnnotations();

  // 高亮选中文字
  highlightSelection(pendingSelection.range, id);
  pendingSelection = null;

  updateAnnotationPanel();
  updateFileListBadges();
  showToast(comment ? '批注已添加' : '高亮已添加');
}

// ===== 高亮渲染 =====
function highlightSelection(range, id) {
  try {
    const span = document.createElement('span');
    span.className = 'annotation-highlight';
    span.dataset.annotationId = id;
    span.onclick = () => scrollToAnnotationCard(id);
    range.surroundContents(span);
  } catch(e) {
    // 跨节点选中时 surroundContents 会失败，改用 extractContents
    try {
      const fragment = range.extractContents();
      const span = document.createElement('span');
      span.className = 'annotation-highlight';
      span.dataset.annotationId = id;
      span.onclick = () => scrollToAnnotationCard(id);
      span.appendChild(fragment);
      range.insertNode(span);
    } catch(e2) {
      console.warn('高亮失败:', e2);
    }
  }
}

function restoreHighlights(filePath) {
  const fileAnnotations = annotations[filePath] || [];
  const docContent = document.getElementById('doc-content');

  fileAnnotations.forEach(ann => {
    if (ann.resolved) return;
    // 在文档中搜索引用文字并高亮
    highlightTextInDoc(docContent, ann.quote, ann.id);
  });
}

function highlightTextInDoc(container, text, id) {
  if (!text || text.length < 2) return;

  const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
  const nodes = [];
  let node;
  while (node = walker.nextNode()) nodes.push(node);

  for (const textNode of nodes) {
    const idx = textNode.textContent.indexOf(text);
    if (idx === -1) continue;

    // 检查是否已经在高亮 span 内
    if (textNode.parentElement.classList.contains('annotation-highlight')) continue;

    const range = document.createRange();
    range.setStart(textNode, idx);
    range.setEnd(textNode, idx + text.length);

    const span = document.createElement('span');
    span.className = 'annotation-highlight';
    span.dataset.annotationId = id;
    span.onclick = () => scrollToAnnotationCard(id);

    try {
      range.surroundContents(span);
    } catch(e) {}
    break; // 只高亮第一个匹配
  }
}

// ===== 批注面板 =====
function updateAnnotationPanel() {
  const list = document.getElementById('annotation-list');
  const fileAnnotations = (annotations[currentFile] || []);
  const activeCount = fileAnnotations.filter(a => !a.resolved).length;

  document.getElementById('annotation-count').textContent = activeCount;
  document.getElementById('submit-btn').disabled = activeCount === 0;

  if (fileAnnotations.length === 0) {
    list.innerHTML = `
      <div id="empty-annotations">
        <div class="icon">✏️</div>
        <p>选中文档中的文字<br>即可添加批注</p>
      </div>`;
    return;
  }

  list.innerHTML = '';
  // 倒序显示（最新在前）
  [...fileAnnotations].reverse().forEach(ann => {
    const card = document.createElement('div');
    card.className = `annotation-card${ann.resolved ? ' resolved' : ''}`;
    card.id = `card_${ann.id}`;

    const time = new Date(ann.timestamp).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });

    card.innerHTML = `
      <div class="annotation-quote">"${ann.quote.length > 60 ? ann.quote.slice(0, 60) + '…' : ann.quote}"</div>
      <div class="annotation-comment" contenteditable="${ann.resolved ? 'false' : 'true'}"
           data-id="${ann.id}"
           onblur="updateComment('${ann.id}', this.textContent)"
           placeholder="点击添加修改意见…">${ann.comment || ''}</div>
      <div class="annotation-meta">
        <span>${time}</span>
        <div class="annotation-actions">
          ${!ann.resolved ? `<button class="resolve-btn" onclick="resolveAnnotation('${ann.id}')">✓ 解决</button>` : '<span style="color:#44bb88;font-size:10px">已解决</span>'}
          <button class="delete-btn" onclick="deleteAnnotation('${ann.id}')">删除</button>
        </div>
      </div>
    `;

    card.onclick = (e) => {
      if (e.target.tagName === 'BUTTON' || e.target.contentEditable === 'true') return;
      scrollToHighlight(ann.id);
    };

    list.appendChild(card);
  });
}

function updateComment(id, text) {
  if (!currentFile || !annotations[currentFile]) return;
  const ann = annotations[currentFile].find(a => a.id === id);
  if (ann) {
    ann.comment = text.trim();
    persistAnnotations();
  }
}

function resolveAnnotation(id) {
  if (!currentFile || !annotations[currentFile]) return;
  const ann = annotations[currentFile].find(a => a.id === id);
  if (ann) {
    ann.resolved = true;
    persistAnnotations();
    // 更新高亮样式
    const el = document.querySelector(`[data-annotation-id="${id}"]`);
    if (el) el.style.opacity = '0.4';
    updateAnnotationPanel();
    updateFileListBadges();
    showToast('已标记为解决');
  }
}

function deleteAnnotation(id) {
  if (!currentFile || !annotations[currentFile]) return;
  annotations[currentFile] = annotations[currentFile].filter(a => a.id !== id);
  persistAnnotations();
  // 移除高亮
  const el = document.querySelector(`[data-annotation-id="${id}"]`);
  if (el) {
    const parent = el.parentNode;
    while (el.firstChild) parent.insertBefore(el.firstChild, el);
    parent.removeChild(el);
  }
  updateAnnotationPanel();
  updateFileListBadges();
  showToast('批注已删除');
}

function clearResolved() {
  if (!currentFile || !annotations[currentFile]) return;
  annotations[currentFile] = annotations[currentFile].filter(a => !a.resolved);
  persistAnnotations();
  updateAnnotationPanel();
  updateFileListBadges();
  showToast('已清除已解决批注');
}

function scrollToHighlight(id) {
  const el = document.querySelector(`[data-annotation-id="${id}"]`);
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.style.background = '#ff6b9d88';
    setTimeout(() => el.style.background = '', 1500);
  }
}

function scrollToAnnotationCard(id) {
  const card = document.getElementById(`card_${id}`);
  if (card) {
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    card.style.borderLeftColor = '#c96bff';
    setTimeout(() => card.style.borderLeftColor = '', 1500);
  }
}

function scrollToFirstAnnotation() {
  const first = document.querySelector('.annotation-highlight');
  if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
  else showToast('当前文档没有批注');
}

// ===== 提交给 Manus =====
function submitAnnotations() {
  if (!currentFile || !annotations[currentFile]) return;

  const active = annotations[currentFile].filter(a => !a.resolved);
  if (active.length === 0) { showToast('没有待处理的批注'); return; }

  const lines = [
    `# PRD 修改指令`,
    ``,
    `**文档**: \`${currentFile}\``,
    `**批注数量**: ${active.length} 条`,
    `**生成时间**: ${new Date().toLocaleString('zh-CN')}`,
    ``,
    `---`,
    ``
  ];

  active.forEach((ann, i) => {
    lines.push(`## 批注 ${i + 1}`);
    lines.push(``);
    lines.push(`**原文引用**:`);
    lines.push(`> ${ann.quote}`);
    lines.push(``);
    if (ann.comment) {
      lines.push(`**修改意见**:`);
      lines.push(ann.comment);
    } else {
      lines.push(`**修改意见**: （仅高亮，请根据上下文判断是否需要修改）`);
    }
    lines.push(``);
    lines.push(`---`);
    lines.push(``);
  });

  lines.push(`> 以上批注由 Pico PRD Review 工具生成，请逐条处理后更新文档。`);

  document.getElementById('submit-output').textContent = lines.join('\n');
  document.getElementById('submit-modal').classList.add('show');
}

function closeSubmitModal() {
  document.getElementById('submit-modal').classList.remove('show');
}

function copyOutput() {
  const text = document.getElementById('submit-output').textContent;
  navigator.clipboard.writeText(text).then(() => {
    showToast('已复制到剪贴板！');
    closeSubmitModal();
  });
}

// ===== 工具函数 =====
function persistAnnotations() {
  localStorage.setItem('pico_annotations', JSON.stringify(annotations));
}

function updateFileListBadges() {
  document.querySelectorAll('.file-item').forEach(el => {
    const path = el.dataset.path;
    const count = (annotations[path] || []).filter(a => !a.resolved).length;
    const existing = el.querySelector('.badge');
    if (count > 0) {
      if (existing) existing.textContent = `${count} 条批注`;
      else el.insertAdjacentHTML('beforeend', `<span class="badge">${count} 条批注</span>`);
    } else {
      if (existing) existing.remove();
    }
  });
}

function toggleDark() {
  document.getElementById('doc-area').classList.toggle('dark-mode');
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}
</script>
